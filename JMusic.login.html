<!DOCTYPE html>
<html>
  <head>
    <title>Jmusic</title>
    <link rel="stylesheet" href="styles/login.css">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/antd/4.23.4/antd.min.css" />
<style>
@import url('https://fonts.googleapis.com/css2?family=Faculty+Glyphic&display=swap');
</style>
  </head>

  <body>
        <div class="container">

    <div class="header">
      <img src="styles/images/jmusic_logo.png" alt="" class="logo">
      <p class="tp1">Don't have an account?</p>
       <a href="#" class="sig">Create new account</a>
    </div>

    <div class="content_box">
      <p class="tp2">Login to JMusic</p>

    <div id="g_id_onload"
    data-client_id="1063818440582-38k7m72p93oijp9ciam4b0jb04j3hgp9.apps.googleusercontent.com"
    data-context="login"
    data-ux_mode="popup"
    data-callback="handleCredentialResponse">
    </div>
    
    <div class="g_id_signin" data-type="standard"></div>
    
    <div class="ant-divider"></div>
    <div class="ant-divider ant-divider-horizontal ant-divider-with-text"
    style="color: rgba(78, 75, 75, 0.753); border-color: rgba(116, 110, 110, 0.842);">
      <span class="ant-divider-inner-text" style="color: black; margin-bottom: 10px;">Or SignIn with Email</span>
    </div>
        <form action="">
    <div class="client_cred">
        <div class="memdiv">
    <div class="emdiv"><img src="images/icons8-email-50.png" alt="" class="img1"></div><input  type="email" required placeholder="Email Address" class="email_input"></div>
    <div class="memdiv">
    <div class="emdiv"><img src="images/icons8-key-24.png" alt="" class="img1"></div><input type="" required placeholder="Enter Password" class="password_input"></div></div>
    <button class="btn1 faculty-glyphic-regular" onclick="window.location.href='homepage.html'">Login now</button> </form>
  </div>
 </div>
<script>
  function handleCredentialResponse(response) {
      console.log("Encoded JWT ID token: " + response.credential);
  }
</script>
</body>
</html>
