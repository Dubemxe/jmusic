<div class="my_header">

  <!-- Left section : Profile button -->
  <div class="header-left">
    <img
      src="styles/images/icons8-user-64.png"
      class="pic2 profile-btn"
      id="profileBtn"
      alt="Profile menu">
  </div>


  <!-- Center section : Artist search -->
  <div class="search_div">

    <input
      placeholder="Search for your favorites..."
      class="searchbar"
      id="artistSearchInput">

    <button
      class="searchbtn"
      id="searchBtn"
      onclick="searchArtist(); popupaDiv();">

      <img
        src="styles/images/icons8-search-48.png"
        class="img"
        alt="Search">

    </button>

  </div>


  <!-- Right section : Navigation menu toggle -->
  <div class="header-right">
    <img
      src="styles/images/hamburger-menu2.png"
      class="pic1 ham_menu"
      id="menuBtn"
      alt="Open menu">
  </div>

</div>

<div class="home-container">


  <!-- LEFT AREA : Artist selection -->

  <div class="artists-section">

    <div class="section-header">
      <p class="section-title">Select Preferred Artists</p>
    </div>

    <!-- Dynamic artist grid populated by JavaScript -->
    <div id="artistGrid" class="artist-grid"></div>

    <!-- Continue to next page -->
    <button
      class="continue-btn"
      onclick="toSearchpage(); completeList();">

      Continue

    </button>

  </div>



  <!-- RIGHT AREA : Discover artists -->

  <div class="discover-section">

    <p class="discover-title">Discover New Artists</p>

        <div class="carousel" id="artistCarousel"></div>


    <!-- Promotional card -->

    <div class="ad-card">

      <p class="ad-title">JMusic</p>
      <p class="ad-subtitle">Home Of Favorites</p>

      <img
        src="styles/images/adPic.jpg"
        class="ad-img"
        alt="JMusic promotion">

    </div>

  </div>

</div>
