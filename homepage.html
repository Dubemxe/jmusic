<!DOCTYPE html>
<html>
  <head>
    <title>Jmusic</title>
      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">    
    <link rel="stylesheet" href="styles/home.css">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Kanit:ital,wght@0,300;0,400;0,500;0,600;0,700;1,600;1,700&family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap" rel="stylesheet">
  </head>

  <body>
<div class="everything_box">
   
     <div class="header">
        <div class="my_header">
          <!-- left section -->
            <div class="header-left">
            <img src="styles/images/icons8-user-64.png"
            class="pic2 profile-btn"
            id="profileBtn">
        </div>

    <!-- center section -->
      <div class="search_div">
        <input 
          placeholder="Search for your favorites..."
          class="searchbar"
          id="artistSearchInput">
        <button class="searchbtn"
        id="searchBtn"
        onclick="searchArtist(); popupaDiv();">
        <img src="styles/images/icons8-search-48.png" class="img">
        </button>
      </div>

    <!-- right section -->
    <div class="header-right">
        <img src="styles/images/hamburger-menu2.png"
        class="pic1 ham_menu"
        id="menuBtn">
    </div>

</div>


<!-- SIDE PANEL -->
<div class="side-panel" id="sidePanel">

    <div class="panel-header">
        <h3>Menu</h3>
        <span id="closePanel">✕</span>
    </div>

    <ul class="panel-links">
        <li>About Us</li>
        <li>Support</li>
        <li>Settings</li>
        <li>Account</li>
        <li>Logout</li>
    </ul>

</div>
    </div>
<div class="home-wrapper">

  <div class="home-container">

    <!-- LEFT SECTION -->
    <div class="artists-section">

      <div class="section-header">
        <p class="section-title">Select Preferred Artists</p>
      </div>

      <div id="artistGrid" class="artist-grid"></div>

      <button class="continue-btn" onclick="toSearchpage(); completeList();">
        Continue
      </button>

    </div>


    <!-- RIGHT SECTION -->
    <div class="discover-section">

      <img src="styles/images/updated_banner(2).jpg" class="discover-banner">

      <p class="discover-title">Discover New Artists</p>

      <div class="ad-card">

        <p class="ad-title">JMusic</p>
        <p class="ad-subtitle">Home Of Favorites</p>

        <img src="styles/images/adPic.jpg" class="ad-img">

      </div>

    </div>

  </div>

  <div class="search_back" id="searchbackDiv"></div>

</div>


<script src="static/get_info.js"></script>
<script src="static/search_artists.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>


  </body>
</html>
